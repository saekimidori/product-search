<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Search</title>

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Product Search</h1>
    </header>

    <main>
        <form id="search-form">
            <input
                type="text"
                id="search-input"
                placeholder="Search for a product..."
            >

            <select id="category-select">
                <option value="favorites">Favorites</option>
                <option value="all">All Categories</option>
            </select>

            <select id="sort-select">
                <option value="default">Sort by</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating-high">Rating: High to Low</option>
                <option value="rating-low">Rating: Low to High</option>
            </select>

            <button type="submit">Search</button>
            <button type="button" id="clear-search">Clear</button>
        </form>

        <section id="product-results">
            <p id="status-message">Loading products...</p>
        </section>

        <div id="load-more-container">
            <p id="product-count"></p>
            <button id="load-more">Load More</button>
        </div>

        <div id="product-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-content">
                <button
                    id="close-modal"
                    type="button"
                    aria-label="Close product details"
                >
                    ×
                </button>
                <div id="product-details"></div>
            </div>
        </div>
    </main>

    <script src="product-search.js"></script>
</body>
</html>
